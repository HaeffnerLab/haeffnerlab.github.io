<td style="width:112px">
    {% if include.image %}
        <img src="{{ include.image }}" alt="Photo of {{ include.name | strip_html }}"
             style="float:right; height:200px;" />
    {% endif %}
</td>
{% if include.full_row %}
<td colspan="3" style="width:750px">
{% else %}
<td style="width:350px">
{% endif %}
    <h2>{{ include.name }}</h2>
    <script>
        emicon("{{ include.email_suffix }}", "{{ include.email_domain }}", "{{ include.email_name }}");
    </script>
    <h3 class="contact">{{ include.title }}</h3>
    <p class="bio">{{ include.bio }}</p>
</td>
